# 复制到受控的外部目录并通过 RUOYI_APP_EXTERNAL_CONFIG 指向该文件；不得提交真实凭据。
spring:
  datasource:
    url: jdbc:mysql://db-host:3306/adm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
  redis:
    host: redis-host
    port: 6379
    password: ${APP_REDIS_PASSWORD:}
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.ruoyi.**.domain
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-value: 1
      logic-not-delete-value: 0
